server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  # Note: nginx drops server-level add_header in any location that declares its own,
  # so the security headers are repeated per location.

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # Overwrite, never append: the backend trusts the left-most X-Forwarded-For entry,
    # so a client-supplied value would let it pick its own rate-limit key.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # The access token lives in JS memory, so XSS = session theft; the Vite build has no inline scripts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }
}
